name: Update PDF index and deploy

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) -- four checks a day, so a
    # new document shows up within hours rather than within a week.
    #
    # A check is not the same as a full crawl. Each run first asks the sitemap
    # what changed (three requests) and only crawls if something did, or if the
    # last full crawl is over --max-age hours old. Four full crawls a day would
    # be ~86,000 requests against a nonprofit's site for nothing.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Crawl even if aa.org looks unchanged"
        required: false
        type: boolean
        default: false
      max_age_hours:
        description: "Crawl anyway if the last full crawl is older than this"
        required: false
        default: "24"
      depth:
        description: "Extra link-following depth beyond the sitemap"
        required: false
        default: "3"
      max_pages:
        description: "Maximum pages to crawl"
        required: false
        default: "25000"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/**"
      - ".github/workflows/update-index.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    name: Re-crawl aa.org
    runs-on: ubuntu-latest
    # A full crawl is ~5,400 pages plus a HEAD per file; ~15 min in practice.
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Record current index size
        id: before
        run: |
          if [ -f data/pdfs.csv ]; then
            echo "count=$(( $(wc -l < data/pdfs.csv) - 1 ))" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi

      # Three requests that decide whether the next ~8,000 are worth making.
      - name: Has aa.org changed?
        id: gate
        if: github.event_name != 'push'
        run: |
          python tools/should_crawl.py \
            --max-age "${{ github.event.inputs.max_age_hours || '24' }}" \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # A plain push to main only redeploys the site; it must not re-crawl.
      - name: Crawl aa.org
        if: github.event_name != 'push' && steps.gate.outputs.should_crawl == 'true'
        run: |
          python tools/crawl_aa_pdfs.py \
            --max-pages "${{ github.event.inputs.max_pages || '25000' }}" \
            --depth "${{ github.event.inputs.depth || '3' }}" \
            --workers 10

      # Reads each kit's contents PDF and re-matches the item numbers it names.
      # Allowed to fail without blocking the document index: the previous
      # kits.csv stays valid, and the step shows up red in the run.
      - name: Rebuild service-kit contents
        if: github.event_name != 'push' && steps.gate.outputs.should_crawl == 'true'
        continue-on-error: true
        run: python tools/build_kits.py

      - name: Sanity-check the new index
        if: github.event_name != 'push' && steps.gate.outputs.should_crawl == 'true'
        run: |
          before=${{ steps.before.outputs.count }}
          after=$(( $(wc -l < data/pdfs.csv) - 1 ))
          echo "Previous: $before documents / New: $after documents"
          if [ "$after" -lt 100 ]; then
            echo "::error::Only $after documents found - aborting rather than publishing a broken index."
            exit 1
          fi
          # A sudden collapse usually means aa.org changed or started blocking us.
          if [ "$before" -gt 0 ] && [ "$after" -lt $(( before * 70 / 100 )) ]; then
            echo "::error::Document count fell from $before to $after (>30% drop). Refusing to publish."
            echo "::error::Re-run manually to confirm, or adjust the crawler if aa.org changed."
            exit 1
          fi

      # Records the sitemap fingerprint so the next check can tell nothing moved.
      - name: Record the crawl fingerprint
        if: github.event_name != 'push' && steps.gate.outputs.should_crawl == 'true'
        run: python tools/should_crawl.py --commit

      - name: Commit updated index
        id: commit
        if: github.event_name != 'push' && steps.gate.outputs.should_crawl == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to the index."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            count=$(( $(wc -l < data/pdfs.csv) - 1 ))
            git commit -m "Update aa.org PDF index ($count documents)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## aa.org PDF index"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "- Redeploy only (triggered by a push); no crawl."
            elif [ "${{ steps.gate.outputs.should_crawl }}" != "true" ]; then
              echo "- **Checked, no crawl needed.** ${{ steps.gate.outputs.reason }}"
              echo "- The figures below are from the last crawl."
            else
              echo "- **Crawled.** ${{ steps.gate.outputs.reason }}"
            fi
            if [ -f data/meta.json ]; then
              python - <<'PY'
          import json
          m = json.load(open("data/meta.json"))
          print(f"- **{m['total_pdfs']:,} documents** across {m['pages_crawled']:,} pages")
          print(f"- Stale links filtered out: {m.get('broken_links', 0)}")
          added = m.get("added_since_last_run")
          if added is not None:
              print(f"- **New since the last run: {added}** "
                    f"(removed: {m.get('removed_since_last_run', 0)}) - "
                    f"this is what the app notifies members about")
          print(f"- Languages: " + ", ".join(f"{k} ({v})" for k, v in m["languages"].items()))
          print(f"- Rebuilt: {m['generated_utc']}")
          try:
              k = json.load(open("data/kits_meta.json"))
              print(f"- Service kits: {k['kits']} covering "
                    f"{k['coverage']}/{k['total_items']} listed items")
          except Exception:
              print("- Service kits: not rebuilt this run")
          print("\n| Section | Documents |\n|---|---:|")
          for k, v in m["sections"].items():
              print(f"| {k} | {v} |")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    # This job only applies when Pages is set to "GitHub Actions". If Pages is
    # instead set to "Deploy from a branch", the commit the update job pushed
    # publishes on its own and these steps cannot work -- so a failure here must
    # not turn the scheduled run red. The index update is the part that matters.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pick up the commit the update job just pushed.
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
